# Controllers and RL training (control/). Not read by the environment.

[pid]                      # cascade: ball position -> wanted ball accel -> plate tilt -> IK -> servos
kp = 6.0                   # 1/s^2
kd = 3.5                   # 1/s
ki = 0.5                   # 1/s^3
max_tilt_deg = 8.0
roll_factor = 0.6          # a = k g sin(tilt), hollow ball

[train]
algo = "sac"               # sac (continuous, off-policy, sample-efficient), td3, ddpg, ppo, a2c
n_envs = 14                # one process per env
total_steps = 2_000_000
device = "cuda"            # NN on the GPU; physics runs on the CPU workers
seed = 0
norm_obs = true
norm_reward = true
checkpoint_every = 200_000  # ckpt/<algo>_<n>_steps.zip
keep_last_ckpt = 5         # older checkpoints are deleted
best_check_every = 20_000  # env steps between best-model checks
best_min_episodes = 20     # finished episodes needed before the first best.zip
save_replay_buffer = true  # sac/td3/ddpg: replay_buffer.pkl with final.zip (~1.4 GB for 1M), used by --resume
ckpt_replay_buffer = false # also with every checkpoint (one ~1.4 GB file each)
eval_episodes = 10

[algos.ppo]
n_steps = 512              # per env per update
batch_size = 1024
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
ent_coef = 0.0
clip_range = 0.2
net_arch = [256, 256]

[algos.sac]
learning_rate = 3e-4
buffer_size = 300_000      # last 600 episodes (100 min of play); ~0.7 GB RAM with tof_history 10
learning_starts = 10_000   # random actions first (20 episodes) so VecNormalize and Q see the range
batch_size = 256
gamma = 0.99               # 50 Hz -> ~2 s horizon, longer than a fall (~2 s from 0.08 m)
tau = 0.005
train_freq = 1             # per vector step = n_envs transitions
gradient_steps = 7         # 7 updates per 14 transitions (UTD 0.5): 14 envs ~130 steps/s on RTX 3070
ent_coef = "auto"
net_arch = [256, 256]

[algos.td3]
learning_rate = 3e-4
buffer_size = 300_000
learning_starts = 10_000
batch_size = 256
gamma = 0.99
train_freq = 1
gradient_steps = 7         # UTD 0.5 with 14 envs (see sac)
action_noise_sigma = 0.1
net_arch = [256, 256]

[algos.ddpg]
learning_rate = 3e-4
buffer_size = 300_000
learning_starts = 10_000
batch_size = 256
gamma = 0.99
train_freq = 1
gradient_steps = 7         # UTD 0.5 with 14 envs (see sac)
action_noise_sigma = 0.1
net_arch = [256, 256]

[algos.a2c]
n_steps = 16
learning_rate = 7e-4
gamma = 0.99
net_arch = [256, 256]

[tof_net]                  # control/tof_net.py, used by train.py --net tof
layers = [256, 256, 256]   # 3 hidden layers, each Linear -> LayerNorm -> ReLU -> Dropout
dropout = 0.01             # DroQ value: LayerNorm + small dropout steadies Q at higher UTD; 0.1 adds too much noise
actor_head = []            # features -> 3 servo outputs directly (tanh-squashed by SAC)
critic_head = [256]        # Q head on features + action

[tof_net.env]              # env overrides for this net (saved in the run's meta.json)
"env.tof_history" = 10     # 100 ms per sensor (100 Hz). No servo state in the input, so the net
                           # infers plate tilt from ball acceleration: needs > ~3 readings per sensor
                           # with the ball in view. Input = 4 x 10 x 7 = 280

[wandb]                    # Weights & Biases logging in train.py (wandb login once first)
enabled = true             # --no-wandb to skip
project = "ball-on-plate-tof"
entity = ""                # "" = your default W&B entity
mode = "online"            # "online", "offline" (sync later: wandb sync runs/<run>/wandb) or "disabled"
model_save_every = 200_000 # env steps between model uploads to W&B
