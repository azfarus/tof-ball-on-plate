# RL environment (bop_env.env.BallOnPlateEnv). Any key in any config file can be
# overridden at construction: BallOnPlateEnv(overrides={"section.key": value}).
#
# Action: 3 plate servo angles, each divided by platform.range_deg, in [-1, 1].
#   0 = centre pulse (1500 us) = plate flat. The servos latch a new pulse once per
#   PWM frame, so control_hz above platform.servo_update_hz has no effect.
# Observation (dict, SI units):
#   ball_est  [x, y, vx, vy, tracked]   EKF estimate in plate frame
#   tof       [sensor, k, field]        newest tof_history readings per sensor, fields:
#             valid, range_m, sigma_m, signal/S_ref, ambient/S_ref, yaw_rad, age_s
#   servo_cmd [3]                       last action
#   target    [2]                       goal position (m)
#   servo_fb  [3]                       horn angles from the feedback wire (if servo_feedback)
#   plate     [roll, pitch, heave]      measured plate pose (if plate_pose, i.e. an IMU)

control_hz = 50.0
episode_s = 10.0
tof_history = 2            # readings kept per sensor (2 per 20 ms step at 100 Hz)
servo_feedback = false     # needs a feedback servo model, e.g. platform.servo_model = "MG996R_FB"
plate_pose = false
reward_source = "truth"    # position used in the reward: "truth" or "estimate"
interference = true

[start]                    # reset randomisation, uniform in +-value
ball_xy_m = 0.08
ball_v_mps = 0.10
target_xy_m = 0.0          # 0 = always the centre
drop_height_m = 0.0        # > 0: release the ball from up to this height

[reward]                   # r = 1 - w_pos e/half - w_vel |v| - w_rate |da|^2 - w_act |a|^2
w_pos = 1.0                # e = distance to target, half = half plate size
w_vel = 0.1
w_rate = 0.05
w_act = 0.0
escape_penalty = 20.0      # ball centre past the plate edge: reward -escape_penalty, episode ends

[disturb]                  # random forces on the ball (see disturb.py)
kicks_per_s = 0.2
kick_force_n = 0.03
kick_ms = 20.0
push_sigma_n = 0.0003
push_tau_s = 0.3

[overrides]                # applied to the other configs for the env only
"plate.rim_height_m" = 0.0 # no rim: the ball falls off the edge and the episode ends

[randomize]                # "section.key" = [lo, hi], drawn each reset (model is rebuilt)
