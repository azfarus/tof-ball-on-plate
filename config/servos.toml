# Hobby PWM servo library. Every positional servo on store.roboticsbd.com/133-servo-motor
# (fetched 2026-11-04). 360 deg continuous-rotation variants are left out: their pulse
# sets speed, not angle, so they cannot hold a plate pose.
#
# Listed values (from the product pages):
#   kind          "analog" or "digital"
#   travel_deg    angle covered by the pulse range
#   volts         supply voltages the speed/torque are listed at
#   sec_per_60    no-load speed at each voltage (s per 60 deg)
#   torque_kgcm   stall torque at each voltage
#   deadband_us   pulse change the servo ignores
#   mass_g
#   feedback      "none" or "pot" (4th wire with the potentiometer voltage)
# Every model takes 500-2500 us pulses; 1500 us is the centre (servo angle 0).
# Per-model keys can override anything in [default]. "assumed" lists the keys
# that are not on the listing.

[default]
pulse_min_us = 500.0
pulse_max_us = 2500.0
pulse_centre_us = 1500.0
max_frame_hz = 50.0         # fastest PWM frame rate the servo accepts
deadband_us = 5.0
prop_band_deg = 4.0         # error that gives full motor drive (assumed: analog P loop)
backlash_deg = 0.5          # gear play, total (assumed: metal gears)
mech_time_const_s = 0.02    # no-load time to ~63% of top speed (assumed)
friction_frac = 0.02        # gear friction as a fraction of stall torque (assumed)
feedback = "none"
feedback_noise_deg = 0.5    # 1 sigma, pot read through a 10-bit ADC (assumed)

[SG90]
kind = "analog"
travel_deg = 180.0
volts = [4.8, 6.6]
sec_per_60 = [0.10, 0.10]   # only 4.8 V listed
torque_kgcm = [1.2, 1.6]
mass_g = 9.0
deadband_us = 10.0
backlash_deg = 1.0          # nylon gears
assumed = ["deadband_us", "sec_per_60@6.6"]

